name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q nitromaster tests
      - name: Run tests
        run: python -m pytest -q

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: python -m PyInstaller --clean --noconfirm NitroMaster.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NitroMasterPro-exe
          path: dist/NitroMasterPro.exe
